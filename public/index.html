<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AnonChat Pro v2</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root[data-theme="dark"] {
            --bg-primary: #090d16;
            --bg-surface: #131926;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --accent-glow: rgba(147, 51, 234, 0.3);
            --border-color: #1e293b;
            --chat-user: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --chat-partner: #1e293b;
        }

        :root[data-theme="light"] {
            --bg-primary: #f1f5f9;
            --bg-surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            --accent-glow: rgba(6, 182, 212, 0.2);
            --border-color: #cbd5e1;
            --chat-user: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            --chat-partner: #e2e8f0;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            background-color: var(--bg-primary); color: var(--text-main); 
            transition: background 0.3s; height: 100dvh; 
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        
        .hidden { display: none !important; }
        
        /* Layout Grid Shell */
        .app-container { 
            width: 100%; height: 100dvh; background: var(--bg-surface); 
            display: grid; grid-template-columns: 320px 1fr; overflow: hidden; 
        }

        /* Sidebar UI */
        .sidebar { 
            background: var(--bg-surface); border-right: 1px solid var(--border-color); 
            display: flex; flex-direction: column; justify-content: space-between; padding: 28px; 
        }
        .brand-logo { font-size: 1.5rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 24px; letter-spacing: -0.5px; }
        
        .btn { 
            width: 100%; padding: 14px; background: var(--accent-gradient); color: white; 
            border: none; border-radius: 14px; font-weight: 600; cursor: pointer; 
            transition: transform 0.2s, box-shadow 0.2s; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); box-shadow: none; margin-top: 12px; }
        .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }

        /* Auth Panel */
        .auth-panel { 
            grid-column: span 2; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; max-width: 400px; 
            margin: 0 auto; width: 100%; height: 100%; padding: 24px; 
        }
        .auth-panel h2 { margin-bottom: 8px; font-size: 2rem; font-weight: 800; }
        .auth-panel p { color: var(--text-muted); margin-bottom: 28px; font-size: 0.9rem; }
        .input-group { width: 100%; margin-bottom: 18px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-group input { 
            width: 100%; padding: 16px; border-radius: 14px; background: var(--bg-primary); 
            border: 1px solid var(--border-color); color: var(--text-main); outline: none; 
            font-size: 1rem; transition: border-color 0.2s;
        }
        .input-group input:focus { border-color: #6366f1; }

        /* Chat Core Workspace */
        .chat-area { display: flex; flex-direction: column; height: 100dvh; background: var(--bg-primary); width: 100%; }
        .chat-header { 
            padding: 18px 24px; background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color); display: flex; 
            justify-content: space-between; align-items: center; z-index: 5;
        }
        .partner-info h4 { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; }
        .status-dot.offline { background: #64748b; }

        /* Fixes Mobile Scrolling & Layout Visibility Container */
        .chat-messages { 
            flex: 1; padding: 24px; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 14px;
            scroll-behavior: smooth;
        }
        
        .msg-bubble { 
            max-width: 75%; padding: 14px 18px; border-radius: 18px; 
            line-height: 1.5; font-size: 0.98rem; word-break: break-word; 
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .msg-bubble.me { background: var(--chat-user); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-bubble.them { background: var(--chat-partner); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 4px; }
        .status-system { text-align: center; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; margin: 12px 0; background: rgba(0,0,0,0.1); padding: 6px 14px; border-radius: 20px; align-self: center; }

        /* Dynamic Input Bar Workspace */
        .chat-input-wrapper { background: var(--bg-surface); border-top: 1px solid var(--border-color); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .chat-input-bar { display: flex; gap: 10px; align-items: center; width: 100%; }
        
        .input-field-container { flex: 1; display: flex; align-items: center; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 14px; padding: 2px 8px 2px 16px; transition: border-color 0.2s; }
        .input-field-container:focus-within { border-color: #6366f1; }
        .input-field-container input { flex: 1; padding: 14px 0; background: transparent; border: none; color: var(--text-main); outline: none; font-size: 1rem; }
        
        .icon-btn { background: transparent; border: none; color: var(--text-muted); padding: 10px; cursor: pointer; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
        .icon-btn:hover, .icon-btn.active { color: var(--text-main); }
        
        /* Inline Custom Emoji Shelf Drawer */
        .emoji-shelf { display: flex; gap: 12px; overflow-x: auto; padding: 8px 4px; border-bottom: 1px solid var(--border-color); font-size: 1.4rem; -webkit-overflow-scrolling: touch; }
        .emoji-shelf span { cursor: pointer; transition: transform 0.1s; user-select: none; }
        .emoji-shelf span:active { transform: scale(1.3); }

        .theme-toggle { cursor: pointer; padding: 10px 16px; border-radius: 10px; background: var(--bg-primary); border: 1px solid var(--border-color); color: var(--text-main); font-size: 0.85rem; font-weight: 600; }

        /* Landing Control Deck Overlay (Big Search Engine Screen) */
        .lobby-overlay { position: absolute; inset: 0; background: var(--bg-primary); z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
        .lobby-card { max-width: 420px; width: 100%; }
        .radar-pulse { width: 96px; height: 96px; background: var(--accent-gradient); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; position: relative; box-shadow: 0 0 30px var(--accent-glow); }
        .radar-pulse::before, .radar-pulse::after { content: ''; position: absolute; inset: -4px; border: 2px solid #a855f7; border-radius: 50%; animation: pulseRing 1.5s linear infinite; opacity: 0; }
        .radar-pulse::after { animation-delay: 0.75s; }

        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes popIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 📱 RESPONSIVE MOBILE MARKUP OVERRIDES */
        @media (max-width: 768px) {
            .app-container { grid-template-columns: 1fr; }
            .sidebar { display: none !important; }
            .chat-area { height: 100dvh; }
            .msg-bubble { max-width: 85%; }
            .mobile-header-btn { display: flex !important; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="auth-view" class="auth-panel">
            <div class="brand-logo" style="font-size: 2.2rem; margin-bottom: 8px;">AnonChat</div>
            <p>Connect instantly with real people worldwide.</p>
            <div class="input-group">
                <label>Custom Username</label>
                <input type="text" id="username" placeholder="Pick an alias..." autocomplete="off">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn" id="btn-login">Login Space</button>
            <button class="btn btn-secondary" id="btn-register">Create New Profile</button>
            <p id="auth-error" style="color:#ef4444; font-size:0.85rem; margin-top:15px;" class="hidden"></p>
        </div>

        <div id="sidebar-view" class="sidebar hidden">
            <div>
                <div class="brand-logo">AnonChat Pro</div>
                <div style="background: var(--bg-primary); padding: 18px; border-radius: 16px; border: 1px solid var(--border-color);">
                    <p style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;">Active Profile</p>
                    <h3 id="desktop-username" style="margin-top: 4px; font-weight: 700;">Guest</h3>
                </div>
            </div>
            <button class="theme-toggle" id="desktop-theme-btn">🌓 Change Theme</button>
        </div>

        <div id="chat-view" class="chat-area hidden">
            <div class="chat-header">
                <div class="partner-info">
                    <h4 id="header-title">Welcome Portal</h4>
                    <p style="font-size:0.8rem; color:var(--text-muted);" id="header-subtitle">Ready to search matches</p>
                </div>
                <button class="theme-toggle mobile-header-btn" id="mobile-theme-btn" style="display:none;">🌓 Mode</button>
            </div>
            
            <div style="position: relative; flex: 1; display: flex; flex-direction: column; overflow: hidden;">
                <div id="lobby-deck" class="lobby-overlay">
                    <div class="lobby-card">
                        <div class="radar-pulse" id="radar-node">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 19v4M8 23h8"/></svg>
                        </div>
                        <h3 id="lobby-status-title" style="font-size: 1.5rem; font-weight: 800; margin-bottom: 8px;">Find Your Match</h3>
                        <p id="lobby-status-desc" style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 24px;">No strings attached. Join rooms instantly.</p>
                        <button class="btn" id="action-match-btn">⚡ Connect to Random User</button>
                        <button class="btn btn-danger hidden" id="action-cancel-btn">🛑 Cancel Search</button>
                    </div>
                </div>

                <div class="chat-messages" id="chat-box"></div>
            </div>

            <div class="chat-input-wrapper">
                <div class="emoji-shelf hidden" id="emoji-panel">
                    <span>😀</span><span>😂</span><span>😍</span><span>👍</span><span>🔥</span><span>🎉</span><span>💀</span><span>👀</span><span>❤️</span><span>✨</span><span>🤔</span><span>💯</span>
                </div>
                
                <div class="chat-input-bar">
                    <button class="btn btn-danger" id="inline-skip-btn" style="width: auto; padding: 14px 18px; border-radius: 14px;" title="Skip Stranger">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    </button>
                    
                    <div class="input-field-container">
                        <button class="icon-btn" id="emoji-toggle-btn" type="button">😊</button>
                        <input type="text" id="msg-input" placeholder="Type a message..." disabled>
                    </div>
                    
                    <button class="btn" id="btn-send" style="width: auto; padding: 14px 20px;" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io(window.location.origin);
        let themeState = 'dark';
        let profileName = '';
        let matchState = 'idle'; // idle, queuing, connected

        const DOM = {
            authView: document.getElementById('auth-view'),
            sidebarView: document.getElementById('sidebar-view'),
            chatView: document.getElementById('chat-view'),
            usernameInp: document.getElementById('username'),
            passwordInp: document.getElementById('password'),
            loginBtn: document.getElementById('btn-login'),
            registerBtn: document.getElementById('btn-register'),
            authError: document.getElementById('auth-error'),
            chatBox: document.getElementById('chat-box'),
            msgInp: document.getElementById('msg-input'),
            sendBtn: document.getElementById('btn-send'),
            headerTitle: document.getElementById('header-title'),
            headerSubtitle: document.getElementById('header-subtitle'),
            lobbyDeck: document.getElementById('lobby-deck'),
            lobbyTitle: document.getElementById('lobby-status-title'),
            lobbyDesc: document.getElementById('lobby-status-desc'),
            matchBtn: document.getElementById('action-match-btn'),
            cancelBtn: document.getElementById('action-cancel-btn'),
            inlineSkip: document.getElementById('inline-skip-btn'),
            emojiToggle: document.getElementById('emoji-toggle-btn'),
            emojiPanel: document.getElementById('emoji-panel'),
            radar: document.getElementById('radar-node')
        };

        // Theme management controls
        function toggleTheme() {
            themeState = themeState === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', themeState);
        }
        document.getElementById('desktop-theme-btn').addEventListener('click', toggleTheme);
        document.getElementById('mobile-theme-btn').addEventListener('click', toggleTheme);

        // Authentication Submission Pipeline
        DOM.loginBtn.addEventListener('click', () => dispatchAuth(false));
        DOM.registerBtn.addEventListener('click', () => dispatchAuth(true));

        function dispatchAuth(isRegistering) {
            socket.emit('auth', {
                username: DOM.usernameInp.value.trim(),
                password: DOM.passwordInp.value,
                isRegistering
            });
        }

        socket.on('auth-response', (res) => {
            if (res.success) {
                profileName = res.username;
                document.getElementById('desktop-username').innerText = profileName;
                DOM.authView.classList.add('hidden');
                DOM.sidebarView.classList.remove('hidden');
                DOM.chatView.classList.remove('hidden');
            } else {
                DOM.authError.innerText = res.message;
                DOM.authError.classList.remove('hidden');
            }
        });

        // Matchmaking State Loops
        DOM.matchBtn.addEventListener('click', () => {
            socket.emit('find-match');
        });

        DOM.cancelBtn.addEventListener('click', () => {
            socket.emit('skip-match');
            revertToLobby('Search cancelled.');
        });

        DOM.inlineSkip.addEventListener('click', () => {
            if (matchState === 'connected') {
                socket.emit('skip-match');
                revertToLobby('You left the room.');
            } else {
                revertToLobby('Ready to match.');
            }
        });

        socket.on('waiting', () => {
            matchState = 'queuing';
            DOM.matchBtn.classList.add('hidden');
            DOM.cancelBtn.classList.remove('hidden');
            DOM.lobbyTitle.innerText = "Searching Layouts...";
            DOM.lobbyDesc.innerText = "Waiting to link with someone online.";
            DOM.radar.style.animation = "pulseRing 1s infinite alternate";
        });

        socket.on('match-found', (data) => {
            matchState = 'connected';
            DOM.lobbyDeck.classList.add('hidden');
            DOM.msgInp.removeAttribute('disabled');
            DOM.sendBtn.removeAttribute('disabled');
            DOM.headerTitle.innerHTML = `<span class="status-dot"></span> ${data.partnerName}`;
            DOM.headerSubtitle.innerText = "Secure Connection Active";
            DOM.chatBox.innerHTML = '';
            appendSystemMessage(`Connected with **${data.partnerName}**. Be respectful.`);
            DOM.msgInp.focus();
        });

        socket.on('partner-disconnected', () => {
            revertToLobby('Stranger disconnected from the session.');
        });

        function revertToLobby(reason) {
            matchState = 'idle';
            DOM.msgInp.setAttribute('disabled', 'true');
            DOM.sendBtn.setAttribute('disabled', 'true');
            DOM.msgInp.value = '';
            DOM.emojiPanel.classList.add('hidden');
            DOM.headerTitle.innerText = "Lobby Portal";
            DOM.headerSubtitle.innerText = "Disconnected";
            DOM.cancelBtn.classList.add('hidden');
            DOM.matchBtn.classList.remove('hidden');
            DOM.lobbyTitle.innerText = "Find Your Match";
            DOM.lobbyDesc.innerText = reason;
            DOM.lobbyDeck.classList.remove('hidden');
        }

        // Messaging Dispatch Frame Pipeline
        DOM.sendBtn.addEventListener('click', postMessage);
        DOM.msgInp.addEventListener('keypress', (e) => { if(e.key === 'Enter') postMessage(); });

        function postMessage() {
            const txt = DOM.msgInp.value.trim();
            if(!txt) return;
            socket.emit('send-message', txt);
            appendMessage(txt, 'me');
            DOM.msgInp.value = '';
            DOM.emojiPanel.classList.add('hidden');
        }

        socket.on('receive-message', (msg) => {
            appendMessage(msg, 'them');
        });

        function appendMessage(text, side) {
            const node = document.createElement('div');
            node.className = `msg-bubble ${side}`;
            node.innerText = text;
            DOM.chatBox.appendChild(node);
            DOM.chatBox.scrollTop = DOM.chatBox.scrollHeight;
        }

        function appendSystemMessage(text) {
            const sysNode = document.createElement('div');
            sysNode.className = 'status-system';
            sysNode.innerText = text;
            DOM.chatBox.appendChild(sysNode);
            DOM.chatBox.scrollTop = DOM.chatBox.scrollHeight;
        }

        // Emoji Interactivity Panels
        DOM.emojiToggle.addEventListener('click', () => {
            DOM.emojiPanel.classList.toggle('hidden');
        });

        DOM.emojiPanel.querySelectorAll('span').forEach(em => {
            em.addEventListener('click', () => {
                if(!DOM.msgInp.disabled) {
                    DOM.msgInp.value += em.innerText;
                    DOM.msgInp.focus();
                }
            });
        });
    </script>
</body>
</html>
